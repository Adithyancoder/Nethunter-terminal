apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.deprecation = true
}

android {
  compileSdkVersion rootProject.ext.android.COMPILE_SDK_VERSION

  defaultConfig {
    applicationId = "com.offsec.nhterm"
    minSdkVersion rootProject.ext.android.MIN_SDK_VERSION
    targetSdkVersion rootProject.ext.android.TARGET_SDK_VERSION
    versionCode = rootProject.ext.versionCode
    versionName = rootProject.ext.versionName
    testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    resourceConfigurations += ['zh-rCN', 'zh-rTW']
    externalNativeBuild {
      cmake {
        cppFlags += "-std=c++20"
        abiFilters += ['arm64-v8a', 'armeabi-v7a', 'x86_64']
      }
    }
    signingConfigs {
      debug {
        storeFile file('nethunter-debug.jks')
        keyAlias 'nethunter'
        storePassword 'nethunter'
        keyPassword 'nethunter'
      }
    }
    sourceSets {
      main {
        jniLibs.srcDirs = ['src/main/jniLibs']
      }
    }
  }
  buildTypes {
    release {
      debuggable = false
    }
  }
  externalNativeBuild {
    cmake {
      path = "CMakeLists.txt"
    }
  }
  compileOptions {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
  }
  lint {
    abortOnError = false
    checkReleaseBuilds = false
  }
  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
  }

  namespace = 'com.offsec.nhterm'
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  testImplementation "junit:junit:${rootProject.ext.android.JUNIT_VERSION}"
  androidTestImplementation project(path: ':NeoLang')

  implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.android.KOTLIN_VERSION}"

  implementation 'org.greenrobot:eventbus:3.3.1'
  implementation 'com.github.wrdlbrnft:modular-adapter:0.3.0.31'
  implementation 'com.github.wrdlbrnft:sorted-list-adapter:0.3.0.27'
  implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'
  implementation 'de.psdev.licensesdialog:licensesdialog:2.2.0'
  implementation 'com.github.GrenderG:Color-O-Matic:1.1.5'
  implementation 'com.github.topjohnwu.libsu:core:6.0.0'
  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.cardview:cardview:1.0.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.appcompat:appcompat-resources:1.7.1'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.preference:preference-ktx:1.2.1'
  implementation 'androidx.compose.material:material:1.7.8'

  // Backports for lower api levels
  implementation 'com.llamalab.safs:safs-core:0.2.0'

  implementation project(':chrome-tabs')
  implementation project(':NeoLang')
  implementation project(':NeoTermBridge')
  implementation project(':Xorg')
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}
