// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext.kotlin_version = '2.2.21'
  ext.android = [
    KOTLIN_VERSION     : '2.2.21',
    MIN_SDK_VERSION    : 21,
    COMPILE_SDK_VERSION: 36,
    TARGET_SDK_VERSION : 34,
    JUNIT_VERSION      : "4.13.2"
  ]

  ext {
    //version=YYYY:MM:VV:RR (Either "VV" for stable version OR "RR" for pre-release candidate (e.g. 0001 for rc1))
    //noinspection HighAppVersionCode
  }

  // Assign properties on ext using the explicit assignment syntax to avoid
  // the deprecated Groovy DSL property call form inside the ext {} block.
  ext.versionCode = 2025090001
  ext.versionName = "2025.4-dev"

  ext.deps = [
    "annotations"         : "androidx.annotation:annotation:1.0.0",
    "appcompat-v7"        : "androidx.appcompat:appcompat:1.0.0",
    "design"              : "com.android.support:design:${ext.android.ANDROID_SUPPORT_VERSION}",
    "cardview-v7"         : "com.android.support:cardview-v7:${ext.android.ANDROID_SUPPORT_VERSION}",
    "kotlin-stdlib"       : "org.jetbrains.kotlin:kotlin-stdlib:${ext.android.KOTLIN_VERSION}",
    "kotlin-gradle-plugin": "org.jetbrains.kotlin:kotlin-gradle-plugin:${ext.android.KOTLIN_VERSION}",
    "junit"               : "junit:junit:${ext.android.JUNIT_VERSION}"
  ]

  repositories {
    maven { url = "https://maven.fabric.io/public" }
    maven { url = 'https://plugins.gradle.org/m2/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://artifactory.appodeal.com/appodeal-public/' }
    maven { url = 'https://dl.google.com/dl/android/maven2/' }
    mavenCentral()
    google()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.13.1'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.8.5'
    classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
  }
}

allprojects {
  repositories {
    maven { url = "https://repo.grails.org/grails/core" }
    maven { url = 'https://dl.google.com/dl/android/maven2/' }
    mavenCentral()
    maven { url = "https://jitpack.io" }
    google()
  }
}

tasks.register('clean', Delete) {
  delete(rootProject.layout.buildDirectory.asFile)
}
